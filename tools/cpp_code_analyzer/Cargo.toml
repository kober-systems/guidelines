[package]
name = "cpp_code_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codespan-reporting = "0.13"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
layout-rs = "0.1"
log = "0.4"
env_logger = "0.11"
ast-grep-core = "0.45.0"

[dev-dependencies]
pretty_assertions = "1"
